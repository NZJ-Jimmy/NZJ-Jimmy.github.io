site_name: GNU/Linux Guides
site_description: GNU/Linux installation guides, tips and notes
site_url: https://nzj-jimmy.github.io/linux/
repo_url: https://github.com/E-Vertin/GNU-Linux-Guides
repo_name: E-Vertin/GNU-Linux-Guides
edit_uri: edit/main/

docs_dir: content/GNU-Linux-Guides

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页:
      - English: README.md
      - 繁體中文: README.zh-HK.md
  - Arch Linux:
      - 安裝指南: Arch Linux Guide/Arch Linux 安裝指南.md
      - 使用貼士: Arch Linux Guide/Arch 使用貼士.md
      - Installation Guide: Arch Linux Guide/Installation Guide for Arch Linux.md
      - Tips for Using Arch: Arch Linux Guide/Tips for Using Arch.md
  - EndeavourOS:
      - Installation Guide: EOS Guide/Installation Guide for Endeavour OS, A Distro Based On archlinux.md
  - Gentoo Linux:
      - 安裝指南: Gentoo Guide/Gentoo Linux 安裝指南.md
      - 使用貼士: Gentoo Guide/Gentoo 使用貼士.md
      - 磁碟加密安裝: Gentoo Guide/Gentoo 磁碟加密安裝.md
      - 安全啓動指南: Gentoo Guide/Gentoo 安全啓動啓用指南.md
      - Installation Guide: Gentoo Guide/Installation Guide for Gentoo Linux.md
      - Gentoo on LUKS: Gentoo Guide/Gentoo on LUKS.md
      - Secure Boot via Shim: Gentoo Guide/Instructions for enabling Secure Boot via Shim on Gentoo.md
      - Tips for Using Gentoo: Gentoo Guide/Tips for Using Gentoo.md
  - 通用技巧:
      - General Tips: General Tips/General Tips.md

copyright: >
  Content from E-Vertin/GNU-Linux-Guides ·
