name: Build GNU/Linux Guides

on:
  push:
    branches:
      - gh-pages
    paths:
      - "mkdocs-linux.yml"
      - ".gitmodules"
      - "content/GNU-Linux-Guides"
      - ".github/workflows/linux-guides.yml"
  schedule:
    - cron: "23 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-guides
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homepage and submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update guide submodule
        run: |
          git -C content/GNU-Linux-Guides fetch origin main
          git -C content/GNU-Linux-Guides checkout --detach origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: python -m pip install --upgrade mkdocs-material

      - name: Build guides
        run: |
          rm -rf .linux-site
          mkdocs build --config-file mkdocs-linux.yml --site-dir .linux-site

      - name: Publish only /linux
        run: |
          rm -rf linux
          mv .linux-site linux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/GNU-Linux-Guides linux

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update GNU/Linux guides"
            git push
          fi
